syntax = "proto3";

package crafty.proto.rpc;

message RequestVote {
    int32 node_id = 1;
    int32 current_term = 2;
    int32 last_index = 3;
    int32 last_term = 4;
}

message RequestVoteReply {
    int32 node_id = 1;
    int32 current_term = 2;
    bool vote = 3;
}

message AppendEntries {
    int32 leader_id = 1;
    int32 current_term = 2;        
    int32 commit_index = 3;
    int32 prefix_length = 4;
    int32 prefix_term = 5;
    repeated LogEntry suffix = 6;
}

message AppendEntriesReply {
    int32 node_id = 1;
    int32 current_term = 2;        
    int32 ack = 3;
    bool valid = 4;
}

message LogEntry {
  int32 term  = 1;
  bytes  data  = 2;
}

message PersistentState {
    int32 current_term = 1;
    int32 voted_for = 2;
    repeated LogEntry log = 3;
}

message Envelope {
    enum MessageType {
        APPEND_ENTRIES = 0;
        REQUEST_VOTE = 1;
        APPEND_ENTRIES_REPLY = 2;
        REQUEST_VOTE_REPLY = 3;
    }

    MessageType type = 1;
    bytes data = 2;
}